# nginx na frente do Acervo Psico: porta 80 da VM (o LARCC encaminha a 138.94.76.170:22233).
# Primeira barreira contra abuso: limita requisições, corpo pequeno e timeouts curtos.
#
# Numa sala de aula todos saem pelo MESMO IP do Wi-Fi. Se o limite fosse só por IP, um
# aluno com um script esgotaria a cota da sala inteira. Por isso há dois limites:
#  - por PESSOA (IP + cookie de sessão): o normal; cada navegador logado tem a sua cota;
#  - por IP, bem mais alto: só contra enxurrada. Cookie inventado não ajuda o atacante:
#    sem sessão válida o app responde 401 na hora, sem trabalho (só /entrar é aberto).

map $cookie_acervo_sessao $acervo_quem {
    ""      $remote_addr;
    default "$remote_addr|$cookie_acervo_sessao";
}

# Folgado para uma pessoa (o leitor de PDF carrega dezenas de arquivos de uma vez).
limit_req_zone  $acervo_quem        zone=acervo_pessoa:20m rate=40r/s;
limit_req_zone  $binary_remote_addr zone=acervo_ip:10m     rate=300r/s;
limit_conn_zone $acervo_quem        zone=acervo_conn_pessoa:20m;
limit_conn_zone $binary_remote_addr zone=acervo_conn:10m;

# Só o POST de login entra no limite de login (carregar a tela não conta).
map $request_method $acervo_chave_login {
    POST    $binary_remote_addr;
    default "";
}
# Folgado para a turma toda entrar no mesmo minuto pelo mesmo IP; quem chuta senha é
# barrado pelo app (10 erros no mesmo login = 15 min bloqueado) e pelo hash scrypt, caro.
limit_req_zone $acervo_chave_login zone=acervo_login:10m rate=120r/m;

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    server_tokens off;
    client_max_body_size 64k;      # não há upload: nenhuma requisição precisa ser grande
    client_body_timeout 15s;
    client_header_timeout 15s;
    keepalive_timeout 30s;
    limit_conn acervo_conn_pessoa 60;   # um navegador usa até ~6; 60 é folga
    limit_conn acervo_conn 1000;        # a sala inteira junta
    limit_req_status 429;
    limit_conn_status 429;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/x-javascript;

    proxy_set_header Host              $http_host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;

    location = /entrar {
        limit_req zone=acervo_login burst=60 nodelay;
        limit_req zone=acervo_ip burst=2000 nodelay;
        proxy_pass http://127.0.0.1:8000;
    }

    # A IA pode levar minutos para ler e responder: timeout maior só aqui.
    location ~ ^/(perguntar|preparar)$ {
        limit_req zone=acervo_pessoa burst=5 nodelay;
        limit_req zone=acervo_ip burst=100 nodelay;
        proxy_buffering off;           # streaming: cada pedaço da resposta passa na hora
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_pass http://127.0.0.1:8000;
    }

    location / {
        limit_req zone=acervo_pessoa burst=300 nodelay;
        limit_req zone=acervo_ip burst=2000 nodelay;
        proxy_read_timeout 60s;
        proxy_pass http://127.0.0.1:8000;
    }
}
